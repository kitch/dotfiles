services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://host.containers.internal:11434
    volumes:
      - ${HOME}/.local/share/open-webui:/app/backend/data
    restart: unless-stopped

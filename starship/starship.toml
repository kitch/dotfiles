# Starship prompt — tuned for Go + Kubernetes + git workflows
# Docs: https://starship.rs/config/

"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$golang\
$kubernetes\
$terraform\
$docker_context\
$cmd_duration\
$line_break\
$character"""

# Wait 10ms for starship to check files (fast)
scan_timeout = 10
command_timeout = 500

# ── Directory ──────────────────────────────────────────────────────────────────
[directory]
style = "bold blue"
truncation_length = 4
truncate_to_repo = true
read_only = " 󰌾"

# ── Git ────────────────────────────────────────────────────────────────────────
[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold red"
conflicted = "⚠️ "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "📦 "
modified = "!${count} "
staged = "+${count} "
deleted = "✘${count} "

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bold yellow"

# ── Go ─────────────────────────────────────────────────────────────────────────
[golang]
symbol = " "
style = "bold cyan"
format = "[$symbol($version )]($style)"
detect_files = ["go.mod", "go.sum", "go.work", ".go-version"]

# ── Kubernetes ─────────────────────────────────────────────────────────────────
[kubernetes]
disabled = false
symbol = "☸ "
style = "bold green"
format = "[$symbol$context( \\($namespace\\))]($style) "

# ── Terraform ──────────────────────────────────────────────────────────────────
[terraform]
symbol = "󱁢 "
style = "bold 105"
format = "[$symbol$workspace]($style) "

# ── Docker ─────────────────────────────────────────────────────────────────────
[docker_context]
symbol = " "
style = "bold blue"
format = "[$symbol$context]($style) "
only_with_files = true

# ── Command duration ──────────────────────────────────────────────────────────
[cmd_duration]
min_time = 2_000
format = "[⏱ $duration]($style) "
style = "bold yellow"

# ── Hostname (only shown over SSH) ────────────────────────────────────────────
[hostname]
ssh_only = true
format = "[@$hostname]($style) "
style = "bold dimmed green"

# ── Username (only shown when root or over SSH) ───────────────────────────────
[username]
show_always = false
format = "[$user]($style) "
style_user = "bold dimmed blue"
style_root = "bold red"

# ── Prompt character ──────────────────────────────────────────────────────────
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

# ── Languages (disabled to keep prompt fast — enable as needed) ───────────────
[nodejs]
disabled = true

[python]
disabled = false
symbol = " "
format = "[$symbol($version )]($style)"

[rust]
disabled = false
symbol = " "
format = "[$symbol($version )]($style)"
